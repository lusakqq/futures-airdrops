name: airdrop-alerts
# Бот аирдропов в облаке GitHub: каждые 30 минут одна проверка, компьютер не нужен.
# Токен и ID получателей лежат в Settings -> Secrets and variables -> Actions:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID (несколько ID через запятую)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/airdrop-alerts.yml]
concurrency:
  group: airdrop-alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 2_bot_airdrops/requirements.txt
      - run: pip install -r 2_bot_airdrops/requirements.txt
      # sent.json - список уже отправленных постов, переносим между запусками
      - name: Restore sent list
        id: state
        uses: actions/cache/restore@v4
        with:
          path: 2_bot_airdrops/sent.json
          key: airdrop-state-${{ github.run_id }}
          restore-keys: airdrop-state-
      - run: "[ -f 2_bot_airdrops/sent.json ] || echo '[]' > 2_bot_airdrops/sent.json"
      - name: Test post (only when this file changes)
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TIMEZONE: Europe/Kyiv
        run: python 2_bot_airdrops/airdrop_bot.py --test
      - name: Check announcements
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TIMEZONE: Europe/Kyiv
          # самый первый запуск без списка: берём только последний час, чтобы не повторить старые посты
          LOOKBACK_HOURS: ${{ steps.state.outputs.cache-matched-key == '' && '1' || '24' }}
        run: python 2_bot_airdrops/airdrop_bot.py --once
      - name: Save sent list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: 2_bot_airdrops/sent.json
          key: airdrop-state-${{ github.run_id }}
